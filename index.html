<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงทะเบียนนิสิตช่วยงาน SWU OPH 2026 (3 วัน)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 sm:px-6">

  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="bg-gradient-to-r from-red-700 to-rose-600 text-white p-6 rounded-3xl shadow-xl text-center mb-6">
      <span class="bg-white/20 text-xs px-3 py-1 rounded-full font-semibold tracking-wider uppercase">SWU OPH 2026</span>
      <h1 class="text-2xl sm:text-3xl font-bold mt-2">ระบบลงทะเบียนนิสิตช่วยงาน</h1>
      <p class="text-rose-100 text-sm mt-1">รายงานตัวปฏิบัติหน้าที่ (วันที่ 13 - 14 - 15)</p>
    </div>

    <!-- กล่องค้นหา -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 mb-6">
      <label class="block text-gray-700 font-semibold mb-2">ค้นหาด้วยรหัสนิสิต (11 หลัก) หรือชื่อ-นามสกุล</label>
      <div class="flex gap-2">
        <input type="text" id="searchInput" placeholder="กรุณากรอกรหัสนิสิต หรือ ชื่อ-นามสกุล" 
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-600 focus:outline-none">
        <button onclick="searchStudent()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-medium transition shadow-md">
          ค้นหา
        </button>
      </div>
      <div id="loader" class="text-center py-3 text-sm text-gray-500 hidden">กำลังดึงข้อมูล...</div>
    </div>

    <!-- การ์ดแสดงผลข้อมูลและปุ่มลงทะเบียน 3 วัน -->
    <div id="resultCard" class="hidden bg-white rounded-3xl shadow-lg border border-gray-100 p-6">
      <!-- ข้อมูลส่วนตัว -->
      <div class="border-b border-gray-100 pb-4 mb-4">
        <h2 id="resName" class="text-xl font-bold text-gray-800"></h2>
        <p id="resId" class="text-gray-500 font-mono text-sm"></p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3 text-sm text-gray-600">
          <p><strong class="text-gray-800">คณะ:</strong> <span id="resFaculty"></span></p>
          <p><strong class="text-gray-800">ฝ่าย:</strong> <span id="resRole" class="text-red-600 font-semibold"></span></p>
        </div>
      </div>

      <!-- ส่วนลงทะเบียนรายวัน (13, 14, 15) -->
      <h3 class="font-bold text-gray-800 mb-3 text-sm uppercase tracking-wider">สถานะการลงทะเบียน 3 วัน</h3>
      
      <div class="space-y-3">
        <!-- วันที่ 13 -->
        <div class="flex items-center justify-between p-3.5 rounded-2xl border border-gray-100 bg-slate-50">
          <div>
            <div class="font-semibold text-gray-800">วันที่ 13</div>
            <div id="status13" class="text-xs text-gray-500">ยังไม่ลงทะเบียน</div>
          </div>
          <button id="btn13" onclick="confirmDay('13')" class="px-4 py-2 rounded-xl text-sm font-semibold transition"></button>
        </div>

        <!-- วันที่ 14 -->
        <div class="flex items-center justify-between p-3.5 rounded-2xl border border-gray-100 bg-slate-50">
          <div>
            <div class="font-semibold text-gray-800">วันที่ 14</div>
            <div id="status14" class="text-xs text-gray-500">ยังไม่ลงทะเบียน</div>
          </div>
          <button id="btn14" onclick="confirmDay('14')" class="px-4 py-2 rounded-xl text-sm font-semibold transition"></button>
        </div>

        <!-- วันที่ 15 -->
        <div class="flex items-center justify-between p-3.5 rounded-2xl border border-gray-100 bg-slate-50">
          <div>
            <div class="font-semibold text-gray-800">วันที่ 15</div>
            <div id="status15" class="text-xs text-gray-500">ยังไม่ลงทะเบียน</div>
          </div>
          <button id="btn15" onclick="confirmDay('15')" class="px-4 py-2 rounded-xl text-sm font-semibold transition"></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ** ใส่ Web App URL ของคุณที่นี่ **
    const API_URL = 'https://script.google.com/macros/s/AKfycbxw2j0Dm58zqoLHz3bpl50C6mrM6Jv4Ig2UPuz6ONnL35EVKunCOfAr0wTwfwduDRdd/exec';
    
    let studentsData = [];
    let currentStudent = null;

    async function loadData() {
      document.getElementById('loader').classList.remove('hidden');
      try {
        const res = await fetch(API_URL);
        studentsData = await res.json();
      } catch (err) {
        console.error("โหลดข้อมูลล้มเหลว", err);
      } finally {
        document.getElementById('loader').classList.add('hidden');
      }
    }
    loadData();

    function searchStudent() {
      const q = document.getElementById('searchInput').value.trim();
      const card = document.getElementById('resultCard');
      if (!q) return;

      currentStudent = studentsData.find(s => s.studentId === q || s.name.includes(q));

      if (currentStudent) {
        document.getElementById('resName').innerText = currentStudent.name;
        document.getElementById('resId').innerText = `รหัสนิสิต: ${currentStudent.studentId}`;
        document.getElementById('resFaculty').innerText = currentStudent.faculty;
        document.getElementById('resRole').innerText = currentStudent.role;

        renderDayStatus('13', currentStudent.day13);
        renderDayStatus('14', currentStudent.day14);
        renderDayStatus('15', currentStudent.day15);

        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
        Swal.fire('ไม่พบข้อมูล', 'ไม่พบรายชื่อในระบบ SWU OPH 2026', 'warning');
      }
    }

    function renderDayStatus(day, timeValue) {
      const statusEl = document.getElementById(`status${day}`);
      const btn = document.getElementById(`btn${day}`);

      if (timeValue) {
        statusEl.innerHTML = `<span class="text-emerald-600 font-medium">✓ ลงทะเบียนแล้ว</span> (${timeValue})`;
        btn.disabled = true;
        btn.innerText = 'เรียบร้อย';
        btn.className = 'px-4 py-2 bg-gray-200 text-gray-500 text-sm font-semibold rounded-xl cursor-not-allowed';
      } else {
        statusEl.innerText = 'ยังไม่ลงทะเบียน';
        btn.disabled = false;
        btn.innerText = `ลงทะเบียนวันที่ ${day}`;
        btn.className = 'px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl transition shadow-sm';
      }
    }

    async function confirmDay(day) {
      if (!currentStudent) return;

      const confirm = await Swal.fire({
        title: `ลงทะเบียนวันที่ ${day}`,
        text: `คุณต้องการยืนยันการรายงานตัวสำหรับ วันที่ ${day} ใช่หรือไม่?`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'ยืนยัน',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#059669'
      });

      if (!confirm.isConfirmed) return;

      const btn = document.getElementById(`btn${day}`);
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ 
            studentId: currentStudent.studentId,
            day: day 
          })
        });

        const data = await res.json();

        if (data.status === 'success') {
          Swal.fire('สำเร็จ!', `บันทึกการลงทะเบียนวันที่ ${day} เรียบร้อย`, 'success');
          currentStudent[`day${day}`] = data.timestamp;
          renderDayStatus(day, data.timestamp);
        } else {
          throw new Error(data.message);
        }
      } catch (err) {
        Swal.fire('ผิดพลาด', err.message, 'error');
        renderDayStatus(day, currentStudent[`day${day}`]);
      }
    }
  </script>
</body>
</html>
